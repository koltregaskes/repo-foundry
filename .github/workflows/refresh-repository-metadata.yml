name: Refresh repository metadata

on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even when today's metadata is already present
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run refresh:public-repos -- --write --force
          else
            npm run refresh:public-repos -- --write
          fi

      - name: Prepare refreshed public data commit
        id: metadata_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- content/public/generated/site-data.json; then
            echo "Repository metadata is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add content/public/generated/site-data.json
            git commit -m "chore: refresh repository metadata"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git pull --rebase origin main

      - name: Validate repository metadata and public boundary
        run: npm test && npm run build:public-boundary && npm run verify:public-boundary

      - name: Push refreshed repository metadata
        if: steps.metadata_commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Validate routed source for Pages deployment
        id: public_validation
        continue-on-error: true
        run: npm run verify:public-input

      - name: Report deferred Pages deployment
        if: steps.public_validation.outcome == 'failure'
        run: |
          echo "::warning::Repository metadata was refreshed, but Pages deployment was skipped because the routed news source did not pass validation."

      - name: Upload Pages artifact
        if: steps.public_validation.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public

      - name: Deploy Pages artifact
        if: steps.public_validation.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5
