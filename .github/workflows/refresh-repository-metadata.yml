name: Refresh repository metadata

on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even when today's metadata is already present
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: refresh-repository-metadata
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"

      - name: Refresh public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run refresh:public-repos -- --write --force
          else
            npm run refresh:public-repos -- --write
          fi

      - name: Prepare refreshed public data commit
        id: metadata_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- content/public/generated/site-data.json; then
            echo "Repository metadata is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add content/public/generated/site-data.json
            git commit -m "chore: refresh repository metadata"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git pull --rebase origin main

      - name: Validate repository metadata and public boundary
        run: npm test && npm run build:public-boundary && npm run verify:public-boundary

      - name: Push refreshed repository metadata
        if: steps.metadata_commit.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Dispatch the single Pages workflow
        if: steps.metadata_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
