name: Source-date and deployed-proof regressions
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: node --test tests/news-snapshot.test.mjs tests/published-freshness.test.mjs
      - run: npm run build:public-boundary && npm run verify:public-boundary
